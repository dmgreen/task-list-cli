[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "task-list-cli"
version = "0.1.0"
description = "A command-line task list application"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Dalton Green", email = "dmgreen93@gmail.com" },
]
dependencies = []

[project.scripts]
task-list = "task_list_cli:main"

[tool.setuptools]
py-modules = ["task_list_cli"]

[tool.setuptools.packages.find]
where = ["src"]